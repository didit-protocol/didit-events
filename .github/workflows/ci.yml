name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A disposable database for the suites that need real locking. Not a secret: it exists only inside this job.
      TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres
    steps:
      # Actions are pinned to a commit. Dependabot keeps the pins and the version comments up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # The Team page is built with the staff domain. A placeholder, so the build never falls back to another
          # organization's domain and a fork needs no repository setting.
          STAFF_EMAIL_DOMAIN: example.com
          CONTACT_EMAIL: events@example.com
      - run: pnpm size
      - run: pnpm check:standalone
